<!doctype html><html lang='zh-Hant'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#071b34'><meta name='apple-mobile-web-app-capable' content='yes'><meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'><meta name='apple-mobile-web-app-title' content='台股成長雷達'><link rel='manifest' href='./manifest.webmanifest'><link rel='apple-touch-icon' href='./icons/icon-192.png'><title>台股成長產業雷達</title><style>
:root{--bg:#f4f7fb;--card:#fff;--nav:#071b34;--blue:#0878e8;--green:#0aa66d;--red:#e34d59;--amber:#e5a100;--text:#142033;--muted:#667085;--line:#e6ebf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Segoe UI",sans-serif;color:var(--text)}header{background:linear-gradient(135deg,#071b34,#0a3764);color:#fff;padding:22px 18px 18px;position:sticky;top:0;z-index:5}header h1{font-size:21px;margin:0 0 5px}header p{font-size:12px;margin:0;opacity:.8}.wrap{max-width:920px;margin:auto;padding:14px 14px 90px}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{border:0;background:#e9eef5;color:#526070;border-radius:999px;padding:9px 13px;font-weight:700}.tab.active{background:var(--blue);color:#fff}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 4px 16px rgba(15,34,58,.05)}.card h2{font-size:16px;margin:0 0 12px}.industry{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer}.industry:last-child{border:0}.rank{width:26px;height:26px;border-radius:8px;background:#eaf3ff;color:#096fd2;display:grid;place-items:center;font-weight:800}.grow{flex:1}.grow b{display:block}.grow small{color:var(--muted)}.score{font-size:19px;font-weight:900;color:var(--green)}.stocks{width:100%;border-collapse:collapse;font-size:13px}.stocks th,.stocks td{padding:11px 6px;border-bottom:1px solid var(--line);text-align:right}.stocks th:first-child,.stocks td:first-child{text-align:left}.stocks tr{cursor:pointer}.pill{display:inline-block;padding:4px 7px;border-radius:999px;background:#e9f8f1;color:#087b52;font-weight:800}.pill.mid{background:#fff4da;color:#9a6900}.pill.low{background:#ffe9eb;color:#b32938}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.big{font-size:42px;font-weight:900;line-height:1}.subscore{display:grid;gap:5px;font-size:13px;color:var(--muted)}.bar{height:9px;background:#edf1f6;border-radius:9px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#0b7ce8,#0aa66d);border-radius:9px}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.metric{background:#f7f9fc;border-radius:12px;padding:11px}.metric small{color:var(--muted);display:block}.metric b{font-size:17px}.eps{display:flex;align-items:end;gap:8px;height:150px;padding-top:12px}.col{flex:1;text-align:center;font-size:11px;color:var(--muted)}.stick{background:linear-gradient(#0b7ce8,#52aaf6);border-radius:7px 7px 2px 2px;min-height:8px;margin:5px auto;width:72%}.col.future .stick{background:linear-gradient(#e6a000,#ffc84d)}.col b{color:var(--text);font-size:12px}.note{font-size:12px;color:var(--muted);line-height:1.6}.back{border:0;background:#eaf1f9;border-radius:10px;padding:8px 10px;font-weight:800;margin-bottom:12px}.hidden{display:none}.footer{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px;text-align:center;font-size:11px;color:var(--muted);backdrop-filter:blur(10px)}
</style></head><body><header><h1>台股成長產業雷達</h1><p>基本面 × 法人 EPS × 產業前景 × 估值</p></header><main class='wrap'>
<section id='home'><div class='tabs'><button class='tab active'>產業雷達</button><button class='tab' onclick='showOptical()'>光通訊排行</button></div><div class='grid'><div class='card'><h2>🚀 成長產業</h2><div id='industries'></div></div><div class='card'><h2>模型架構</h2><div class='metrics'><div class='metric'><small>歷史基本面</small><b>70分</b></div><div class='metric'><small>未來 EPS</small><b>15分</b></div><div class='metric'><small>產業前景</small><b>15分</b></div><div class='metric'><small>追蹤重點</small><b>法人修正</b></div></div><p class='note'>評分用於研究與比較，不代表投資建議。V1 為研究樣本資料，正式版可再串接公開財報、股價與法人共識資料。</p></div></div></section>
<section id='optical' class='hidden'><button class='back' onclick='goHome()'>← 產業雷達</button><div class='card'><h2>AI 光通訊 / CPO｜10家公司</h2><table class='stocks'><thead><tr><th>公司</th><th>分數</th><th>2027E EPS</th><th>可信度</th></tr></thead><tbody id='stockRows'></tbody></table></div></section>
<section id='detail' class='hidden'><button class='back' onclick='showOptical()'>← 光通訊排行</button><div class='grid'><div class='card'><div class='hero'><div><h2 id='dname'></h2><div class='note' id='drole'></div></div><div class='big' id='dscore'></div></div><div class='metrics'><div class='metric'><small>基本面</small><b id='dbase'></b></div><div class='metric'><small>未來EPS</small><b id='depsScore'></b></div><div class='metric'><small>產業前景</small><b id='dindustry'></b></div><div class='metric'><small>預估可信度</small><b id='dconf'></b></div></div></div><div class='card'><h2>EPS 趨勢</h2><div class='eps' id='epsChart'></div><p class='note' id='revision'></p></div><div class='card'><h2>10項模型摘要</h2><div id='ten'></div></div><div class='card'><h2>研究提醒</h2><p class='note' id='risk'></p></div></div></section>
</main><div class='footer'>MVP v0.1｜示範研究介面・資料非即時</div><script>
const industries=[['AI光通訊 / CPO',95,'800G/1.6T、矽光子'],['AI ASIC / 客製化晶片',92,'CSP自研AI晶片'],['先進封裝',90,'CoWoS、SoIC、HBM'],['液冷散熱',88,'AI伺服器高功耗'],['高速PCB / CCL',86,'AI Switch、Server'],['AI伺服器',85,'GPU/ASIC平台'],['HBM / 記憶體',83,'AI訓練與推論'],['機器人 / Physical AI',80,'感測、伺服、視覺'],['低軌衛星',78,'衛星通訊'],['AI Edge',76,'AI PC、手機']];
const stocks=[
{name:'光聖 6442',score:89,base:61,epss:14,ind:14,conf:'中',role:'高速光通訊連接產品',eps:[23.46,51.41,130],labels:['2025','2026E','2027E'],rev:'2027E 高成長，但法人覆蓋仍少。',risk:'高成長預估需持續驗證訂單、產能與客戶集中度。'},
{name:'聯亞 3081',score:85,base:55,epss:15,ind:15,conf:'高',role:'InP 雷射磊晶 / AI光通訊核心元件',eps:[4.24,19.66,41.36,60],labels:['2025','2026E','2027E','2028E'],rev:'法人預估呈上修方向，2026–28 毛利率與EPS同步擴張。',risk:'需追蹤AI光通訊放量速度、InP供應與高毛利產品占比。'},
{name:'華星光 4979',score:85,base:60,epss:12,ind:13,conf:'中低',role:'光收發模組 / 光通訊元件',eps:[5.43,7.51,14.36],labels:['2025','2026E','2027E'],rev:'2027E EPS具明顯成長斜率。',risk:'注意高速產品出貨與法人覆蓋家數。'},
{name:'全新 2455',score:83,base:57,epss:13,ind:13,conf:'高',role:'GaAs / InP 磊晶',eps:[2.97,5.49,9.28,14.56],labels:['2025','2026E','2027E','2028E'],rev:'法人覆蓋較完整，2027–28 EPS成長明顯。',risk:'光電子與RF產品組合會影響毛利與成長純度。'},
{name:'環宇-KY 4991',score:80,base:50,epss:15,ind:15,conf:'中高',role:'III-V 晶圓代工 / 光通訊',eps:[0.15,5.77,11.32,22.2],labels:['2025','2026E','2027E','2028E'],rev:'轉機型成長，法人看2026–28獲利結構快速改善。',risk:'基期低使成長率很高，需驗證產能利用率與量產進度。'},

{name:'聯鈞 3450',score:78,base:55,epss:12,ind:11,conf:'低',role:'雷射 / 光收發封裝',eps:[5.01,11.97],labels:['2025','2026E'],rev:'獲利改善，但遠期法人共識仍不足。',risk:'需等待2027E共識形成後再提高遠期成長權重。'},

const inds=document.getElementById('industries');industries.forEach((x,i)=>{let d=document.createElement('div');d.className='industry';d.onclick=i===0?showOptical:null;d.innerHTML=`<div class='rank'>${i+1}</div><div class='grow'><b>${x[0]}</b><small>${x[2]}</small></div><div class='score'>${x[1]}</div>`;inds.appendChild(d)});
function hideAll(){['home','optical','detail'].forEach(x=>document.getElementById(x).classList.add('hidden'))}function goHome(){hideAll();document.getElementById('home').classList.remove('hidden');scrollTo(0,0)}function showOptical(){hideAll();document.getElementById('optical').classList.remove('hidden');let b=document.getElementById('stockRows');b.innerHTML='';stocks.forEach((s,i)=>{let c=s.conf.includes('高')?'pill':s.conf.includes('低')?'pill low':'pill mid';let r=document.createElement('tr');r.onclick=()=>showDetail(i);r.innerHTML=`<td><b>${s.name}</b><br><small>${s.role}</small></td><td><b>${s.score}</b></td><td>${s.eps[s.eps.length-1].toFixed(2)}</td><td><span class='${c}'>${s.conf}</span></td>`;b.appendChild(r)});scrollTo(0,0)}
function showDetail(i){hideAll();document.getElementById('detail').classList.remove('hidden');let s=stocks[i];dname.textContent=s.name;drole.textContent=s.role;dscore.textContent=s.score;dbase.textContent=s.base+'/70';depsScore.textContent=s.epss+'/15';dindustry.textContent=s.ind+'/15';dconf.textContent=s.conf;revision.textContent=s.rev;risk.textContent=s.risk;let max=Math.max(...s.eps);epsChart.innerHTML=s.eps.map((v,j)=>`<div class='col ${j?'future':''}'><b>${v}</b><div class='stick' style='height:${Math.max(8,v/max*110)}px'></div>${s.labels[j]}</div>`).join('');let items=[['EPS 5年趨勢',s.base>55?8:6],['PE / Forward PE',6],['OCF / 淨利',s.name.includes('波若威')?4:7],['ROE',s.base>55?8:6],['流動比率',8],['D/E',s.name.includes('聯鈞')?5:8],['FCF趨勢',6],['毛利 / 營益率',s.ind>13?8:7],['未來EPS',s.epss],['產業前景',s.ind]];ten.innerHTML=items.map(x=>`<div style='margin:10px 0'><div style='display:flex;justify-content:space-between;font-size:13px'><b>${x[0]}</b><span>${x[1]}</span></div><div class='bar'><i style='width:${Math.min(100,x[1]/15*100)}%'></i></div></div>`).join('');scrollTo(0,0)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
